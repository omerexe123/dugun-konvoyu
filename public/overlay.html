<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay</title>
  <style>
    /* -------------------------------------------------------------
       OBS & TIKTOK LIVE STUDIO ULTRA-MINIMAL TRANSPARENT OVERLAY
       SIFIR METİN, SIFIR RAKAM, TAM GÖRSEL EŞLEŞTİRME & ANTİ-LOOP
       ------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Konumlandırma Konteyneri (Varsayılan: Sağ Alt, Parametreyle değiştirilebilir) */
    .overlay-container {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 9999;
      pointer-events: none;
    }

    /* Konum Varyantları */
    .pos-bottom-right {
      bottom: 24px;
      right: 20px;
      align-items: flex-end;
    }

    .pos-top-right {
      top: 24px;
      right: 20px;
      align-items: flex-end;
    }

    .pos-top-left {
      top: 24px;
      left: 20px;
      align-items: flex-start;
    }

    .pos-bottom-left {
      bottom: 24px;
      left: 20px;
      align-items: flex-start;
    }

    /* Ultra Minimal Glassmorphism Kart Yapısı */
    .overlay-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 3px 10px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform, opacity;
      animation: microBreath 6s ease-in-out infinite alternate;
    }

    /* Her satır için hafif asenkron nefes alma (Statik piksel bot filtresini kırma) */
    .overlay-badge:nth-child(1) { animation-delay: 0.0s; }
    .overlay-badge:nth-child(2) { animation-delay: 0.4s; }
    .overlay-badge:nth-child(3) { animation-delay: 0.8s; }
    .overlay-badge:nth-child(4) { animation-delay: 1.2s; }
    .overlay-badge:nth-child(5) { animation-delay: 1.6s; }
    .overlay-badge:nth-child(6) { animation-delay: 2.0s; }
    .overlay-badge:nth-child(7) { animation-delay: 2.4s; }
    .overlay-badge:nth-child(8) { animation-delay: 2.8s; }

    @keyframes microBreath {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-0.8px) scale(1.008); }
    }

    /* Sol Taraf: TikTok Hediye İkonu */
    .gift-slot {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gift-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.85));
    }

    /* Orta: Minimalist Bağlantı Oku (→) */
    .arrow-slot {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .arrow-slot svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }

    /* Sağ Taraf: Oyun İçi Aksiyon İkonu */
    .action-slot {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
    }

    .action-slot svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 15 Saniyede Bir Tetiklenen Işık Pırıltısı (Anti-Loop / Dinamik Tarama) */
    .overlay-badge::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .overlay-badge.shimmer::after {
      animation: sweepShimmer 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes sweepShimmer {
      0% { left: -120%; opacity: 0; }
      40% { opacity: 1; }
      100% { left: 220%; opacity: 0; }
    }
  </style>
</head>
<body>

          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9L2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2" fill="#0f172a"/>

        <svg viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- 3. Hat & Mustache → Damat Papyon / Şapka -->
    <div class="overlay-badge">
      <div class="gift-slot">

      </div>
      <div class="arrow-slot">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="action-slot">
        <!-- Damat Papyonu İkonu (Gümüş / Lüks Mavi) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8l8 4-8 4V8z"/>
          <path d="M20 8l-8 4 8 4V8z"/>
          <circle cx="12" cy="12" r="2.2" fill="#1e3a8a"/>
        </svg>
      </div>
    </div>

    <!-- 4. Rose → Drift & Duman Kayması -->
    <div class="overlay-badge">
      <div class="gift-slot">
        <img src="images/gifts/rose.webp" alt="">
      </div>
      <div class="arrow-slot">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="action-slot">
        <!-- Drift Viraj & Lastik İzi İkonu (Kırmızı / Beyaz) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 16c4 0 6-8 12-8s6 4 6 4"/>
          <path d="M6 19c3 0 5-6 10-6s5 3 5 3"/>
          <path d="M17 6l4 2-2 4"/>
        </svg>
      </div>
    </div>

    <!-- 5. GG → Yarış Motosikleti -->
    <div class="overlay-badge">
      <div class="gift-slot">
        <img src="images/gifts/gg.webp" alt="">
      </div>
      <div class="arrow-slot">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="action-slot">
        <!-- Motosiklet İkonu (Zümrüt Yeşili) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="16" r="3"/>
          <circle cx="19" cy="16" r="3"/>
          <path d="M12 16l-3-7h4l3 7"/>
          <path d="M9 9h5l3 3"/>

    </div>

    <!-- 6. TikTok → Alt Şasi Neon Işığı -->
    <div class="overlay-badge">
      <div class="gift-slot">

      <div class="arrow-slot">

      </div>
      <div class="action-slot">
        <!-- Neon Parıltı / Alt Işık İkonu (Siyan / Parlak Turkuaz) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M3 12h3M18 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
          <circle cx="12" cy="12" r="3.5" fill="#083344"/>

    <!-- 7. Cake Slice → Lastik Yakma / Alev (Burnout) -->
    <div class="overlay-badge">
      <div class="gift-slot">
        <img src="images/gifts/cake_slice.webp" alt="">
      </div>
      <div class="arrow-slot">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="action-slot">
        <!-- Alev İkonu (Turuncu / Ateş) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.2.7.9 1.5 1.7 2 2.7z"/>

    <!-- 8. Ice Cream → Tek Teker (Wheelie) -->

        <!-- Tek Teker Motor Kaldırma İkonu (Mor / Şimşek Dinamik) -->

          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
    </div>

  </div>

  <script>
    // URL Parametrelerine Göre Konumlandırma (OBS Browser Source URL: overlay.html?pos=top-left vb.)
    (function initPosition() {
      const params = new URLSearchParams(window.location.search);
      const pos = params.get('pos') || 'bottom-right';
      const container = document.getElementById('overlay');
      if (container) {
        container.className = 'overlay-container pos-' + pos;
      }
    })();

    // Anti-Loop / Dinamik Görünüm: Her 15 saniyede bir kademeli yumuşak parlama dalgası
    (function runAntiLoopShimmer() {
      const badges = document.querySelectorAll('.overlay-badge');
      if (!badges.length) return;

      function triggerWave() {
        badges.forEach((b, idx) => {
          setTimeout(() => {
            b.classList.remove('shimmer');
            // DOM reflow ile animasyonu yeniden tetikle
            void b.offsetWidth;
            b.classList.add('shimmer');
          }, idx * 90);
        });
      }

      // İlk tetikleme 3 saniye sonra, ardından kesin 15 saniyede bir düzenli döngü
      setTimeout(triggerWave, 3000);
      setInterval(triggerWave, 15000);
    })();
  </script>
</body>
</html>
